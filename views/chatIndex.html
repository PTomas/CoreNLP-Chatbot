window.onload = function(){
    const canvas = document.querySelector('.canvas');
    resizeCanvas()

    const ctx = canvas.getContext('2d');
    ctx.lineWidth = "5";
    
    const chatBot = document.getElementById("chatbot");
   
    var int = 0
    function recursiveDraw(x,y){
       for(let i = 0; i < int; i++){
        ctx.strokeStyle = `rgb(
            0
            ${Math.floor(255 - 42.5 * int)}
            ${Math.floor(255 - 42.5 * i)})`;

        ctx.beginPath();
        ctx.moveTo(x+12.5+ int*25, y-50*i)
        ctx.lineTo(x+12.5+ (int+1)*25, y-50*(i))//top, line accross
        ctx.moveTo(x+12.5+ int*25,y-50*i)
        ctx.lineTo(x+12.5+ int*25, y+50*i)//line down
        ctx.moveTo(x+12.5+ int*25, y+50*i)
        ctx.lineTo(x+12.5+ (int+1)*25, y+50*(i))//bottom, line accross
        ctx.stroke()
       }
       int++;

        if(int < 8){
            recursiveDraw((canvas.offsetWidth/2 + chatBot.offsetWidth/2 ), canvas.offsetHeight/2) 
        }
    }

    var int2 = 0
    function recursiveDraw2(x,y){
       for(let i = 0; i < int2; i++){
        ctx.strokeStyle = `rgb(
            0
            ${Math.floor(255 - 42.5 * int2)}
            ${Math.floor(255 - 42.5 * i)})`;

        ctx.beginPath();
        ctx.moveTo(x+12.5- int2*25, y-50*i)
        ctx.lineTo(x+12.5- (int2+1)*25, y-50*(i))//top, line accross
        ctx.moveTo(x+12.5- int2*25,y-50*i)
        ctx.lineTo(x+12.5- int2*25, y+50*i)//line down
        ctx.moveTo(x+12.5- int2*25, y+50*i)
        ctx.lineTo(x+12.5- (int2+1)*25, y+50*(i))//bottom, line accross
        ctx.stroke()
       }
       int2++;

        if(int2 < 8){
            recursiveDraw2((canvas.offsetWidth/2 - chatBot.offsetWidth/2 ), canvas.offsetHeight/2) 
        }
    }

    function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    }
    recursiveDraw((canvas.offsetWidth/2 + chatBot.offsetWidth/2 ), canvas.offsetHeight/2)   
    recursiveDraw2((canvas.offsetWidth/2 - chatBot.offsetWidth/2 ), canvas.offsetHeight/2)   

   
}

window.addEventListener("resize", function(){
    resizeCanvas()
    recursiveDraw()
    recursiveDraw2()
});

async function getSendRes(event) {
    //prevent reload
    if (event) event.preventDefault();
    
    // send the question, then ask for the answers once the server has it
    await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: askVal.value })
    });

    fetch("/answers")
        .then(response => response.json())
        .then(async users => { // Added async here to handle awaits inside
            console.log(users.data);
            var answers = users.data;
            var score = users.score;
            console.log("score: " + score)
            const cardContainer = document.querySelector(".cardContainer");

             //prime speach
             let voices = window.speechSynthesis.getVoices();
            
            // If voices aren't ready, wait for them
            if (voices.length === 0) {
                await new Promise(resolve => {
                    window.speechSynthesis.onvoiceschanged = () => {
                        voices = window.speechSynthesis.getVoices();
                        resolve();
                    };
                });
            }

            let scoreCard = document.querySelector(".score")
            scoreCard.innerHTML = score;
            scoreCard.removeAttribute("hidden");
            setTimeout(() => {
                scoreCard.setAttribute("hidden", true);
            }, 5000); // 5 seconds

            // We iterate through answers and trigger speech as each card is made
            for (const element of answers) {
                // 1. Create the Visual Card
                let card = document.createElement('div');
                card.className = 'card2 left shadow cursor-pointer';
                let title = document.createElement('h5');
                title.innerText = element;
                title.className = 'card-title';
                card.appendChild(title);
                cardContainer.appendChild(card);
                
                await speak(element); // waits until this answer finishes before the next card

            }
        });

    return false; 
}

async function speak(element) {
  const res = await fetch("/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: element })
  });
  if (!res.ok) return console.error("speak failed");

  const url = URL.createObjectURL(await res.blob());
  const audio = new Audio(url);
  await new Promise(done => {
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
  });
  URL.revokeObjectURL(url);
}
